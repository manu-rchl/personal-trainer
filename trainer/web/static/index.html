<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="shell">
  <nav class="sidebar" aria-label="Navigation">
    <div class="sidebar-brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-word">Hub</span>
    </div>

    <div class="sidebar-nav" id="sidebar-nav">
      <div class="nav-section">
        <div class="nav-label">Übersicht</div>
        <a class="nav-item" href="#/" data-hash="#/">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.5" />
            <rect x="13" y="3.5" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.5" />
            <rect x="3.5" y="13" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.5" />
            <rect x="13" y="13" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <span>Dashboard</span>
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-label">Agenten</div>
        <a class="nav-item" href="#/chat/isa" data-hash="#/chat/isa">
          <span class="agent-bullet" style="--dot-color: var(--isa)" aria-hidden="true"></span>
          <span>Isa</span>
        </a>
        <a class="nav-item" href="#/chat/assistant" data-hash="#/chat/assistant">
          <span class="agent-bullet" style="--dot-color: var(--assistant)" aria-hidden="true"></span>
          <span>Assistant</span>
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-label">Daten</div>
        <a class="nav-item" href="#/health" data-hash="#/health">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M3 12h4l2-6 4 12 2-8 1.5 2H21"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Health</span>
        </a>
        <a class="nav-item" href="#/training" data-hash="#/training">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M6.5 9v6M4 10v4M17.5 9v6M20 10v4M8.5 12h7"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <rect x="5.2" y="8.2" width="2.6" height="7.6" rx="1" stroke="currentColor" stroke-width="1.5" />
            <rect x="16.2" y="8.2" width="2.6" height="7.6" rx="1" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <span>Training</span>
        </a>
        <a class="nav-item" href="#/ernaehrung" data-hash="#/ernaehrung">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M7 3v7a2 2 0 0 0 2 2v9M7 3v6M9 3v6M7 10V3M16.5 3c-1.4 0-2.5 2-2.5 5s1.1 5 2.5 5V21"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Ernährung</span>
        </a>
      </div>

      <div class="nav-indicator" id="nav-indicator" aria-hidden="true"></div>
    </div>

    <div class="sidebar-footer" id="sidebar-footer">
      <span class="status-dot" id="status-dot"></span>
      <div class="footer-text">
        <span class="footer-status" id="footer-status">Verbinde …</span>
        <span id="footer-sync">Sync: –</span>
        <span id="footer-db">DB: –</span>
      </div>
    </div>
  </nav>

  <main class="main">
    <header class="view-header">
      <h1 id="view-title">Dashboard</h1>
      <p class="view-subtitle" id="view-subtitle"></p>
    </header>
    <div class="view-container" id="view-container">
      <p class="empty-state">Lade …</p>
    </div>
  </main>

  <nav class="tabbar" aria-label="Navigation mobil">
    <a class="tab-item" href="#/" data-hash="#/">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.5" />
        <rect x="13" y="3.5" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.5" />
        <rect x="3.5" y="13" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.5" />
        <rect x="13" y="13" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.5" />
      </svg>
      <span class="tab-label">Dashboard</span>
    </a>
    <a class="tab-item" href="#/chat/isa" data-hash="#/chat/isa">
      <span class="agent-bullet" style="--dot-color: var(--isa)" aria-hidden="true"></span>
      <span class="tab-label">Isa</span>
    </a>
    <a class="tab-item" href="#/chat/assistant" data-hash="#/chat/assistant">
      <span class="agent-bullet" style="--dot-color: var(--assistant)" aria-hidden="true"></span>
      <span class="tab-label">Assistant</span>
    </a>
    <a class="tab-item" href="#/health" data-hash="#/health">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M3 12h4l2-6 4 12 2-8 1.5 2H21"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span class="tab-label">Health</span>
    </a>
    <button type="button" class="tab-item" id="tab-more" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="5" cy="12" r="1.4" fill="currentColor" />
        <circle cx="12" cy="12" r="1.4" fill="currentColor" />
        <circle cx="19" cy="12" r="1.4" fill="currentColor" />
      </svg>
      <span class="tab-label">Mehr</span>
    </button>
  </nav>

  <div class="more-sheet" id="more-sheet">
    <a class="more-sheet-item" href="#/training" data-hash="#/training">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M6.5 9v6M4 10v4M17.5 9v6M20 10v4M8.5 12h7"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span>Training</span>
    </a>
    <a class="more-sheet-item" href="#/ernaehrung" data-hash="#/ernaehrung">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M7 3v7a2 2 0 0 0 2 2v9M7 3v6M9 3v6M7 10V3M16.5 3c-1.4 0-2.5 2-2.5 5s1.1 5 2.5 5V21"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span>Ernährung</span>
    </a>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
