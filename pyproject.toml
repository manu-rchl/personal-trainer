[project]
name = "trainer"
version = "0.1.0"
description = "Persönlicher AI-Fitness-Trainer — Phase 0-2: Config, DB, Daten-Ingestion, Telegram-Bot + Trainer-Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "anthropic>=0.116.0",
    "python-telegram-bot>=22.8",
    "faster-whisper>=1.2.1",
    "icalendar>=7.2.0",
    "recurring-ical-events>=3.8.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trainer"]
